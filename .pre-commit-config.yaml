# Pre-commit hooks for the SDK repository
# Install dev deps:  uv sync --directory python --group dev
# Enable hooks:      pre-commit install
# Run all files:     pre-commit run --all-files
# Update hooks:      pre-commit autoupdate
# Skip once:         git commit --no-verify

# Recorded dev bodies and generated TypeScript stay byte for byte, out of every rewriting
# hook. Git tracks only contract/SOURCE under contract/, so no hook sees the fetched copy.
exclude: ^(python/tests/data/|typescript/src/generated/)

repos:
  # ---------------------------------------------------------------------------
  # Ruff: fast linter + formatter
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(python|scripts)/
      - id: ruff-format
        files: ^(python|scripts)/

  # ---------------------------------------------------------------------------
  # Core hygiene, JSON/YAML/TOML, security
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Whitespace & endings
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

      # Conflicts & platform quirks
      - id: check-case-conflict
      - id: check-merge-conflict

      # Python sanity
      - id: debug-statements
      - id: check-ast
      - id: check-shebang-scripts-are-executable
      - id: check-builtin-literals
      - id: check-docstring-first

      # Config/data formats
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent=2, --no-sort-keys]
        # Prettier formats the TypeScript package's JSON.
        exclude: |
          (?x)^(
            \.idea/.*|
            \.vscode/.*|
            typescript/.*
          )$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml

      # Basic secret hygiene
      - id: detect-private-key

      # Large files (1MB) with sensible excludes
      - id: check-added-large-files
        args: [--maxkb=5000]
        exclude: |
          (?x)^(
            .*\.parquet|
            .*\.feather|
            uv\.lock
          )$

  # ---------------------------------------------------------------------------
  # Type checking (uses settings from pyproject.toml)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        language: system
        entry: uv run --directory python ty check
        types: [python]
        files: ^python/
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # TypeScript: ESLint and Prettier, tsc, and the generated-code drift check
  # (uses typescript/package.json; install with `pnpm --dir typescript install`)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: typescript-lint
        name: eslint and prettier (typescript)
        language: system
        entry: pnpm --dir typescript lint
        files: ^typescript/
        pass_filenames: false
      - id: typescript-typecheck
        name: tsc (typescript)
        language: system
        entry: pnpm --dir typescript typecheck
        files: ^typescript/
        pass_filenames: false
      - id: typescript-generated
        name: generated code is current (typescript)
        language: system
        entry: pnpm --dir typescript generate:check
        files: ^(typescript/|contract/)
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Spelling (docs + code comments)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [--write-changes]
        exclude: |
          (?x)^(
            .*\.lock|
            .*pnpm-lock\.yaml|
            .*\.parquet|
            .*\.feather
          )$

  # ---------------------------------------------------------------------------
  # GitHub Actions linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ---------------------------------------------------------------------------
  # Markdown formatting (GFM + front matter)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm>=1.0.0
          - mdformat-frontmatter>=2.1.0
