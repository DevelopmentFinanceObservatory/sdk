name: CI

on:
  push:
    branches: [main]
  # feat/** covers a stacked PR, whose base is the branch below it.
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's changed files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      contract: ${{ steps.filter.outputs.contract }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'python/**'
              - 'contract/SOURCE'
              - 'scripts/**'
              - 'ruff.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/python-newest.yml'
            contract:
              - 'contract/SOURCE'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            typescript:
              - 'typescript/**'
              - 'contract/SOURCE'
              - 'scripts/sync_contract.py'
              - '.github/workflows/ci.yml'

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('python/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Fetch the contract at contract/SOURCE
        run: uv run python ../scripts/sync_contract.py

      - name: Run ruff check
        if: matrix.python-version == '3.12'
        run: uv run ruff check . ../scripts

      - name: Run ruff format check
        if: matrix.python-version == '3.12'
        run: uv run ruff format --check . ../scripts

      - name: Run ty
        if: matrix.python-version == '3.12'
        run: uv run ty check

      - name: Check the package layers
        if: matrix.python-version == '3.12'
        run: uv run lint-imports

      - name: Check the generated sync code
        if: matrix.python-version == '3.12'
        run: uv run python ../scripts/gen_sync.py --check

      - name: Check the generated error map
        if: matrix.python-version == '3.12'
        run: uv run python ../scripts/gen_errors.py --check

      - name: Check the generated wire types and strict checks
        if: matrix.python-version == '3.12'
        run: uv run python ../scripts/gen_wire.py --check

      - name: Run tests
        run: uv run pytest --cov='src/dfo' --cov-report=xml --cov-report=term

      # The package must satisfy the bblocks family contract. The doctor is
      # pinned to the bblocks-projects commit that checks subdirectory packages
      # until a release carries it.
      - name: Run the family doctor
        if: matrix.python-version == '3.12'
        working-directory: .
        run: >-
          uvx --from
          "git+https://github.com/ONEcampaign/bblocks-projects@e260942acaae5a3a8773665f0592391e2a76e6c8#subdirectory=bblocks-projects"
          bblocks-projects doctor --family --strict --path python

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          files: ./python/coverage.xml

  # The extras' floors (pandas, polars) are lower than the dev group's, so the
  # project and its extras are installed without the dev group.
  python-lowest:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/python/.venv-lowest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-lowest-${{ hashFiles('python/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-lowest-

      # Old pyarrow has no wheels for 3.14, so the floors run on the oldest Python.
      - name: Set up Python 3.12
        run: uv python install 3.12

      # One install call, so `lowest-direct` lowers only the package's own direct
      # dependencies and its extras. The test tools are pinned to their uv.lock
      # versions on the command line, and their other dependencies resolve
      # together with the package's, so a shared one such as typing-extensions
      # lands on the package's floor.
      - name: Install the package and its extras at their lowest versions
        run: |
          uv venv --python 3.12 "$VIRTUAL_ENV"
          uv export --frozen --only-group dev --no-emit-project --no-hashes \
            --output-file "$RUNNER_TEMP/dev-lock.txt" > /dev/null
          grep -iE '^(pytest|pytest-cov|pyright|ty|duckdb)==' "$RUNNER_TEMP/dev-lock.txt" \
            | sed 's/ .*//; s/;.*//' > "$RUNNER_TEMP/test-tools.txt"
          test "$(wc -l < "$RUNNER_TEMP/test-tools.txt")" -eq 5
          uv pip install --resolution lowest-direct \
            -r "$RUNNER_TEMP/test-tools.txt" -e ".[pandas,polars,xlsx]"

      - name: Show the resolved versions
        run: uv pip list

      - name: Fetch the contract at contract/SOURCE
        run: uv run --no-project --python 3.12 ../scripts/sync_contract.py

      - name: Run tests
        run: uv run --active --no-project pytest --no-cov

  python-newest:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/python-newest.yml

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from typescript/package.json's packageManager.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      # The package scripts that read contract/ fetch it through uv first.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.node-version == '22'
        run: pnpm lint

      - name: Typecheck
        if: matrix.node-version == '22'
        run: pnpm typecheck

      - name: Check that the generated code is current
        if: matrix.node-version == '22'
        run: pnpm generate:check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # `apache-arrow` is an optional peer dependency, `^21.0.0`. The lockfile pins
  # the dev copy, so these two jobs swap it for the oldest and the newest 21.x.
  typescript-arrow:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arrow: ["21.0.0", newest]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install apache-arrow ${{ matrix.arrow }}
        env:
          ARROW: ${{ matrix.arrow }}
        run: |
          if [ "$ARROW" = newest ]; then
            ARROW=$(npm view 'apache-arrow@^21' version --json | jq -r 'if type == "array" then .[-1] else . end')
          fi
          pnpm add --save-dev "apache-arrow@$ARROW"
          pnpm ls apache-arrow --depth 0

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the contract source rev
        id: source
        run: echo "rev=$(cat contract/SOURCE)" >> "$GITHUB_OUTPUT"

      - name: Check out spec-kit at the source rev
        uses: actions/checkout@v7
        with:
          repository: DevelopmentFinanceObservatory/spec-kit
          ref: ${{ steps.source.outputs.rev }}
          fetch-depth: 0
          path: spec-kit

      - name: Check out dfo-apis dev
        uses: actions/checkout@v7
        with:
          repository: DevelopmentFinanceObservatory/apis
          ref: dev
          sparse-checkout: pyproject.toml
          path: apis

      - name: Check that SOURCE is at or behind the dfo-apis pin
        run: scripts/check_contract_pin.py spec-kit apis/pyproject.toml
